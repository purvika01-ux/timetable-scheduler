# Local development stack. `make dev` runs everything; `make services` runs only db + redis.
name: timetable

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment: *api-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api/app:/srv/app/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./apps/api
    command: uv run python -m app.workers.worker
    environment: *api-env
    volumes:
      - ./apps/api/app:/srv/app/app
    depends_on:
      redis: { condition: service_healthy }

  web:
    build: ./apps/web
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web/src:/srv/web/src
      - ./apps/web/messages:/srv/web/messages
    depends_on:
      - api

volumes:
  pgdata:
